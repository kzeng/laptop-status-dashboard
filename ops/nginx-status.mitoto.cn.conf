server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.mitoto.cn;

    ssl_certificate /etc/letsencrypt/live/status.mitoto.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.mitoto.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mitoto/public;
    }

    location ~ ^/(?!$|login$|logout$|healthz$|static(?:/|$)|api/refresh$) {
        return 404;
    }

    location = /login {
        limit_req zone=status_dashboard_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://status_dashboard_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=status_dashboard_general burst=20 nodelay;
        limit_req_status 429;
        limit_conn status_dashboard_conn 12;
        limit_conn_status 429;
        proxy_pass http://status_dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    access_log /var/log/nginx/status-dashboard-access.log;
    error_log /var/log/nginx/status-dashboard-error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name status.mitoto.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mitoto/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
